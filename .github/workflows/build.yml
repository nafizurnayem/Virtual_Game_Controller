name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        architecture: 'x64'

    - name: Compile Installer
      working-directory: packaging
      shell: powershell
      run: |
        .\build_installer.ps1

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VirtualSteeringWheel-Setup
        path: packaging/installer/VirtualSteeringWheel-Setup.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: packaging/installer/VirtualSteeringWheel-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
